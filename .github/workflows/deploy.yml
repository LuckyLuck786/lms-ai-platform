name: Deploy

# PRD §14.2: deploy only after CI is green on main. Authentication is keyless
# (Workload Identity Federation) — no service-account key exists anywhere; the
# provider accepts only this repository's main branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/transitviz-67dus/lms-docker

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images (tagged with the commit SHA for rollback, PRD §14.5)
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$REGISTRY/backend:$SHA" backend
          docker build -t "$REGISTRY/ai-service:$SHA" ai-service
          docker push "$REGISTRY/backend:$SHA"
          docker push "$REGISTRY/ai-service:$SHA"

      # Order matters: the AI service first (the backend calls it), then the
      # worker (it reads both old and new data shapes), then the API, whose
      # boot runs migrations. Flags, secrets and networking persist on each
      # service, so an image-only deploy keeps them.
      - name: Deploy ai-service
        run: gcloud run deploy ai-service --image "$REGISTRY/ai-service:$SHA" --region "$REGION" --quiet
      - name: Deploy worker pool
        run: gcloud run worker-pools deploy lms-worker --image "$REGISTRY/backend:$SHA" --region "$REGION" --quiet
      - name: Deploy backend
        run: gcloud run deploy backend --image "$REGISTRY/backend:$SHA" --region "$REGION" --quiet

      - name: Smoke test
        run: |
          for svc in backend ai-service; do
            URL=$(gcloud run services describe $svc --region "$REGION" --format='value(status.url)')
            curl -sf "$URL/health" || { echo "$svc health check failed"; exit 1; }
          done
          API=$(gcloud run services describe backend --region "$REGION" --format='value(status.url)')
          curl -sf "$API/api/v1/courses?limit=1" >/dev/null
