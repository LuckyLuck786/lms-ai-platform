name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend-integration:
    name: Backend integration (real Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://lms:lms@localhost:5432/lms_it
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://lms:lms@localhost:5432/lms_e2e
      REDIS_URL: redis://localhost:6379
      BACKEND_PORT: "4000"
      CORS_ORIGIN: http://localhost:4173
      AI_SERVICE_URL: http://localhost:9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Start backend (migrate + seed)
        working-directory: backend
        run: |
          npm ci
          npx tsx src/db/migrate.ts
          npx tsx src/db/seeders/seed-demo.ts
          nohup npx tsx src/server.ts > ../backend.log 2>&1 &
      - name: Build and serve frontend against the local API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1
          VITE_DEMO_MODE: "false"
        run: |
          npm ci
          npx vite build
          nohup npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:4000/health >/dev/null && curl -sf localhost:4173 >/dev/null && exit 0
            sleep 2
          done
          cat backend.log frontend.log; exit 1
      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:4173
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            backend.log
            frontend.log

  frontend:
    name: Frontend (typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai-service:
    name: AI service (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest tests/ -q
